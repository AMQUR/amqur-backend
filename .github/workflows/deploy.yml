name: Deploy

# Reviewed release path for the AMQUR backend (docs/crm-workforce/RELEASE_GOVERNANCE.md).
#
#   pull request → CI (ci.yml) → merge to protected main → staging deploy + acceptance
#   → manual approval (GitHub environment "production", required reviewer AMQUR)
#   → lineage guard (refuses any build that does not contain the commit production runs)
#   → production deploy (api + worker) → production smoke.
#
# Targets the services that actually serve AMQUR: Railway project amqur-platform-staging,
#   staging:    backend-staging / worker-staging
#   production: backend-production / worker-production   (DB Postgres-1bjE)
# It never deploys to the legacy dial-us-now-platform project.
#
# Requires repo secret RAILWAY_API_TOKEN (an account/workspace token with access to
# amqur-platform-staging). Without access the first Railway call fails and nothing is deployed.
# Migrations run on API start (prisma migrate deploy); they are additive by policy. Take the
# encrypted pre-release backup (docs/crm-workforce/DISASTER_RECOVERY.md) before approving a
# release that carries a migration. Rollback: deploy the previous prod-* tag (break-glass,
# after scripts/release/verify-lineage.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: e4d54510-bbc0-45bc-9d5b-a19a5ad5132c
  STAGING_URL: https://backend-staging-staging-b699.up.railway.app
  PRODUCTION_URL: https://backend-production-production-2415eedf.up.railway.app

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard — token present
        run: |
          if [ -z "${{ secrets.RAILWAY_API_TOKEN }}" ]; then
            echo "RAILWAY_API_TOKEN secret not configured — owner setup required" >&2
            exit 1
          fi
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Preflight — staging variables this build needs to boot (names only, values never printed)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          railway variables --project "$RAILWAY_PROJECT_ID" --service backend-staging --environment staging --json | node scripts/env-preflight.js staging api
          railway variables --project "$RAILWAY_PROJECT_ID" --service worker-staging --environment staging --json | node scripts/env-preflight.js staging worker
      - name: Publish provenance + deploy api and worker to staging
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for svc in backend-staging worker-staging; do
            railway variables --project "$RAILWAY_PROJECT_ID" --service "$svc" --environment staging \
              --set "APP_COMMIT_SHA=${GITHUB_SHA::7}" \
              --set "APP_BUILD_TIME=${BUILD_TIME}" \
              --set "APP_RELEASE_ID=gh-${{ github.run_id }}-${{ github.run_attempt }}" \
              --set "APP_RELEASE_VERSION=main" \
              --skip-deploys
            railway up --project "$RAILWAY_PROJECT_ID" --service "$svc" --environment staging --ci
          done
      - name: Staging acceptance — this exact build + five stores
        # Read-only apart from anonymous widget conversations; chat checks are skipped unless
        # the staging widget origin is allowed, so no model calls are made by default.
        run: bash scripts/staging-acceptance.sh "$STAGING_URL" "${GITHUB_SHA::7}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Pauses for the required reviewer (AMQUR) on the GitHub "production" environment.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lineage guard — never deploy a build that drops live functionality
        run: bash scripts/release/verify-lineage.sh "$GITHUB_SHA" "$PRODUCTION_URL"
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Preflight — production variables this build needs to boot (names only, values never printed)
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          railway variables --project "$RAILWAY_PROJECT_ID" --service backend-production --environment production --json | node scripts/env-preflight.js production api
          railway variables --project "$RAILWAY_PROJECT_ID" --service worker-production --environment production --json | node scripts/env-preflight.js production worker
      - name: Deploy api and worker to production
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for svc in backend-production worker-production; do
            railway variables --project "$RAILWAY_PROJECT_ID" --service "$svc" --environment production \
              --set "APP_COMMIT_SHA=${GITHUB_SHA::7}" \
              --set "APP_BUILD_TIME=${BUILD_TIME}" \
              --set "APP_RELEASE_ID=gh-${{ github.run_id }}-${{ github.run_attempt }}" \
              --set "APP_RELEASE_VERSION=main" \
              --skip-deploys
            railway up --project "$RAILWAY_PROJECT_ID" --service "$svc" --environment production --ci
          done
      - name: Production smoke — release identity, health, five stores
        run: |
          set -euo pipefail
          scripts/verify-release.sh "$PRODUCTION_URL" "${GITHUB_SHA::7}"
          curl -sf "$PRODUCTION_URL/api/health" | grep -q '"database":"up"'
          for t in jeep-of-chicago dial-nissan-of-chicago dial-chevy-of-chicago infiniti-of-chicago dial-cdjr-of-chicago; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/public/widget-config?tenantSlug=$t&locationSlug=main")
            [ "$code" = "200" ] || { echo "widget-config $t returned $code" >&2; exit 1; }
          done
          echo "production smoke passed"
      - name: Rollback hint on failure
        if: failure()
        run: |
          echo "::error::Production deploy or smoke failed — deploy the previous prod-* tag after scripts/release/verify-lineage.sh (docs/crm-workforce/RELEASE_GOVERNANCE.md)"
